<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Origami — Keel Unit (Open Frames)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- 3D Viewport -->
  <div id="viewport">
    <div id="simulator-container"></div>
    <div id="assembly-container"></div>
    <div id="loading-overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Side Panel -->
  <div id="panel">
    <div id="step-header">
      <div id="step-counter">Step 1 of 12</div>
      <h2 id="step-title">Loading...</h2>
    </div>

    <div id="step-body">
      <div id="step-description"></div>
    </div>

    <div id="controls">
      <div id="fold-slider-group">
        <label for="fold-slider">Fold Amount</label>
        <input type="range" id="fold-slider" min="0" max="100" value="0">
      </div>

      <div id="fx-group" style="margin-bottom: 15px; font-size: 0.9em;">
        <label style="display: flex; align-items: center; cursor: pointer;">
          <input type="checkbox" id="check-cinematic" style="margin-right: 10px;">
          Enable Cinematic Effects
        </label>
      </div>

      <div id="nav-buttons">
        <button id="btn-prev" disabled>Previous</button>
        <button id="btn-next">Next</button>
      </div>

      <div style="margin-top: 20px; text-align: center;">
        <a href="index.html" style="color: #4488cc; text-decoration: none; font-size: 0.9em; font-weight: bold;">← Back to Sonobe Cube</a>
        <br>
        <a href="golden-venture.html" style="color: #4488cc; text-decoration: none; font-size: 0.9em; font-weight: bold;">Golden Venture Folding →</a>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/keel-main.js"></script>

</body>
</html>
